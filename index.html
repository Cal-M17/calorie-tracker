svg=`<svg viewBox="0 0 320 120" width="100%" role="img" aria-label="Weight over time">`+P.map(p=>`<circle cx="${X(p.date)}" cy="${Y(p.kg)}" r="2.5" fill="var(--mu)"/>`).join("")+`<polyline fill="none" stroke="var(--ac)" stroke-width="2.5" points="${P.map(p=>X(p.date)+","+Y(p.t)).join(" ")}"/></svg><small>Dots are daily weigh-ins and the line is your trend, which smooths out daily ups and downs. Range ${r1(lo)} to ${r1(hi)} kg.</small>`}
const ch=P.length>=2?P[P.length-1].t-P[0].t:null;
return `<div class="card"><h3>Weight</h3><div class="g2"><input id="wd" type="date" value="${today()}"><input id="wk" type="number" inputmode="decimal" step="0.1" placeholder="Weight in kg"></div><button onclick="addW()">Save weight</button></div>
<div class="card">${last?`<div class="big">${r1(last.t)} <span>kg trend, latest ${r1(last.kg)} kg</span></div>`+(ch!==null?`<small style="margin:6px 0">${ch>0?"Up":ch<0?"Down":"No change"} ${r1(Math.abs(ch))} kg over this period.</small>`:"")+svg:'<div class="empty">Add your first weigh-in above.</div>'}</div>
<div class="card"><h3>Recent weigh-ins</h3>${TR.length?TR.slice(-5).reverse().map(w=>`<div class="row"><div><b>${r1(w.kg)} kg</b><small>${fd(w.date)}</small></div><button class="x" onclick="delW('${w.date}')">Delete</button></div>`).join(""):'<div class="empty">Nothing yet.</div>'}</div>`}
function addW(){const v=+$("#wk").value,d=$("#wd").value;if(!(v>0)||!d)return;S.weights=S.weights.filter(w=>w.date!==d);S.weights.push({date:d,kg:v});save();render()}
function delW(d){S.weights=S.weights.filter(w=>w.date!==d);save();render()}
let days=7;
function vChart(){const B=today(),D=[];for(let i=days-1;i>=0;i--){const d=new Date(B+"T12:00:00");d.setDate(d.getDate()-i);const s=d.toISOString().slice(0,10),T={k:0,p:0,c:0,f:0,n:0};S.log.filter(l=>l.date===s).forEach(l=>{M.forEach(m=>T[m]+=l[m]);T.n++});D.push({s,d,...T})}
const L=D.filter(x=>x.n),av=m=>L.length?L.reduce((a,x)=>a+x[m],0)/L.length:0;
const mx=Math.max(S.target*1.15,...D.map(x=>x.k),1),W=320,H=150,bw=W/days,ty=H-S.target/mx*H;
const bars=D.map((x,i)=>{const h=x.k/mx*H,cx=i*bw+bw/2,lab=days<=7?x.d.toLocaleDateString("en-GB",{weekday:"short"}).slice(0,2):(days<=14||i%5===0?x.d.getDate():"");
return `<rect x="${i*bw+bw*.15}" y="${H-h}" width="${bw*.7}" height="${h}" rx="3" fill="${x.k>S.target?"var(--f)":"var(--ac)"}"/><text x="${cx}" y="${H+14}" text-anchor="middle" font-size="9" fill="var(--mu)">${lab}</text>`}).join("");
const pk=av("p")*4,ck=av("c")*4,fk=av("f")*9,tt=pk+ck+fk||1,sh=v=>r(v/tt*100);
const rg=[7,14,30].map(n=>`<button class="${days===n?"":"alt"}" onclick="days=${n};render()">${n} days</button>`).join("");
return `<h2>Charts</h2><div class="seg">${rg}</div><div class="card"><h3>Calories per day</h3><svg viewBox="0 0 ${W} ${H+20}" width="100%" role="img" aria-label="Daily calories">${bars}<line x1="0" x2="${W}" y1="${ty}" y2="${ty}" stroke="var(--mu)" stroke-dasharray="4 3"/></svg>
<small>Dashed line is your ${S.target} kcal target. Bars turn amber when you go over it.</small></div>
<div class="card"><h3>Averages on logged days</h3>${L.length?`<div class="big">${r(av("k"))} <span>kcal a day, ${L.length} day${L.length===1?"":"s"} logged</span></div>
<div class="mac" style="margin:12px 0"><div><b style="color:var(--p)">${r(av("p"))} g</b>protein</div><div><b style="color:var(--c)">${r(av("c"))} g</b>carbs</div><div><b style="color:var(--f)">${r(av("f"))} g</b>fat</div></div>
<div style="display:flex;height:10px;border-radius:5px;overflow:hidden"><i style="width:${sh(pk)}%;background:var(--p)"></i><i style="width:${sh(ck)}%;background:var(--c)"></i><i style="width:${sh(fk)}%;background:var(--f)"></i></div>
<small style="margin-top:6px">Share of calories: protein ${sh(pk)}%, carbs ${sh(ck)}%, fat ${sh(fk)}%</small>`:'<div class="empty">Log some meals and your trends will appear here.</div>'}</div>`+vWeight()}
const NDEF={fi:30,sa:11,su:5,sl:6};
const GDEF={type:"maintain",gw:0,rate:.5,maint:0,ht:0,age:0,sex:"",act:1.375};
function setGL(k,v){const g=cp().gl=cp().gl||{...GDEF};g[k]=(k==="type"||k==="sex")?v:+v||0;save();render()}
function applyGoal(n){S.target=n;save();render()}
function gcalc(){const g={...GDEF,...(cp().gl||{})},W=lastW(),o={g,W,w:[],n:[],ok:true},bad=m=>{o.w.push(m);o.ok=false};
o.est=(g.ht&&g.age&&g.sex&&W)?Math.round((10*W+6.25*g.ht-5*g.age+(g.sex==="m"?5:-161))*g.act):0;o.maint=g.maint||o.est;
o.mx=(g.type==="gain"?Math.min(.5,.005*W):Math.min(1,.01*W))||.5;o.rate=g.type==="maintain"?0:Math.min(g.rate||.25,o.mx);
if(g.age&&g.age<18)bad("This tool is for adults aged 18 and over.");
if(!o.maint)bad("Enter your maintenance calories, or fill in height, age, sex and activity for an estimate.");
if(g.type!=="maintain"){if(!W)bad("Log your weight in Charts first.");
if(g.type==="lose"){if(!g.gw||g.gw>=W)bad("Set a goal weight below your current weight.");
if(!g.ht)bad("Add your height so I can check your goal weight is healthy.");
else if(g.gw&&g.gw/((g.ht/100)**2)<18.5)bad(`That goal weight is below a healthy BMI. The lowest I’ll allow for your height is ${r1(18.5*(g.ht/100)**2)} kg.`)}
else if(!g.gw||g.gw<=W)bad("Set a goal weight above your current weight.")}
if(g.type!=="maintain"&&g.rate>o.mx)o.n.push(`Rate capped at ${o.mx.toFixed(2)} kg a week for your weight.`);
const dl=o.rate*1100,fl=g.sex==="m"?1500:1200;let d=o.maint+(g.type==="gain"?dl:g.type==="lose"?-dl:0),eff=o.rate;
if(g.type==="lose"&&d<fl){d=fl;eff=Math.max(0,(o.maint-fl)/1100);o.n.push(`Held at the ${fl} kcal minimum, so progress will be slower than the rate you chose.`)}
o.daily=Math.round(d);o.delta=Math.abs(o.daily-o.maint);
o.eta=(g.type!=="maintain"&&eff>0&&g.gw&&W&&o.ok)?new Date(Date.now()+Math.abs(g.gw-W)/eff*6048e5):null;return o}
function vGoal(){const o=gcalc(),g=o.g,miss=[!o.W&&"weight",!g.ht&&"height",!g.age&&"age",!g.sex&&"sex"].filter(Boolean),seg=(k,l)=>`<button class="${g.type===k?"":"alt"}" onclick="setGL('type','${k}')">${l}</button>`,
f=(k,l,v)=>`<div><small>${l}</small><input type="number" inputmode="decimal" value="${v||""}" onchange="setGL('${k}',this.value)"></div>`;
const res=(o.ok?`<div class="prev">Daily target: ${o.daily} kcal</div><small>${g.type==="maintain"?"Your maintenance level.":`Maintenance ${o.maint} ${g.type==="gain"?"plus":"minus"} ${r(o.delta)} kcal a day.`}${o.eta?` At this pace you’d reach ${g.gw} kg around ${o.eta.toLocaleDateString("en-GB",{month:"long",year:"numeric"})}.`:""}</small>`:"")+o.w.map(x=>`<small style="color:var(--dn)">${x}</small>`).join("")+o.n.map(x=>`<small>${x}</small>`).join("")+(o.ok?(()=>{const G=goals(o.daily);return `<small>At ${o.daily} kcal, your macros would be about protein ${r(G.P)} g, carbs ${r(G.C)} g and fat ${r(G.F)} g.</small><div class="seg" style="margin-top:10px"><button onclick="applyGoal(${o.daily})">Set as my calorie target</button><button class="alt" onclick="$('#macros').scrollIntoView({behavior:'smooth'})">Adjust macros</button></div>`})():"");
return `<div class="card"><h3>Weight goal for ${esc(cp().name)}</h3><small style="margin-bottom:8px">For healthy adults. Not for pregnancy, breastfeeding or medical conditions, where you should follow your doctor’s advice.</small>
<div class="seg">${seg("lose","Lose")}${seg("maintain","Maintain")}${seg("gain","Gain")}</div>
${g.type!=="maintain"?`<div class="g2">${f("gw","Goal weight (kg)",g.gw)}<div><small>Now</small><b>${o.W?r1(o.W)+" kg":"none logged"}</b></div></div><small>Rate: <b id="rv">${o.rate}</b> kg a week, max ${o.mx.toFixed(2)}</small><input type="range" min="0.05" max="${o.mx}" step="0.05" value="${o.rate||.25}" oninput="$('#rv').textContent=this.value" onchange="setGL('rate',this.value)">`:""}
<div class="g2" style="margin-top:10px"><div><small>Weight (kg)</small><input type="number" inputmode="decimal" step="0.1" value="${o.W?r1(o.W):""}" onchange="setWeightToday(this.value)"></div>${f("ht","Height (cm)",g.ht)}${f("age","Age",g.age)}<div><small>Sex</small><select onchange="setGL('sex',this.value)"><option value="">Choose</option><option value="f"${g.sex==="f"?" selected":""}>Female</option><option value="m"${g.sex==="m"?" selected":""}>Male</option></select></div></div>
<small>Activity</small><select onchange="setGL('act',this.value)">${[[1.2,"Mostly sitting, little exercise"],[1.375,"Light, exercise 1 to 3 days a week"],[1.55,"Moderate, exercise 3 to 5 days a week"],[1.725,"Very active, 6 to 7 days a week"]].map(a=>`<option value="${a[0]}"${g.act==a[0]?" selected":""}>${a[1]}</option>`).join("")}</select>
<div style="margin-top:10px"><small>Maintenance kcal</small><input type="number" inputmode="decimal" value="${g.maint||o.est||""}" placeholder="Needs weight, height, age and sex" onchange="setGL('maint',this.value)">${g.maint&&o.est&&g.maint!==o.est?`<button class="alt" style="margin-top:8px" onclick="setGL('maint',0)">Switch back to the estimate (${o.est})</button>`:""}</div>
<small style="margin:8px 0">${g.maint?"Using your own maintenance figure.":o.est?`This is an estimate from your weight, height, age, sex and activity. Type your own figure to override it.`:`Add your ${miss.join(", ")} to get an estimate.`} About 7,700 kcal equals 1 kg, so real progress varies. Check your trend after a few weeks.</small>${res}</div>`}
function setNT(k,v){const t=cp().nt=cp().nt||{...NDEF};t[k]=+v||0;save();render()}
function setMacroMode(m){const t=cp().mt=cp().mt||{...DEF};if(t.m===m)return;const G=goals(),tot=G.P*4+G.C*4+G.F*9||1,W=lastW();
if(m==="g"){t.gp=r(G.P);t.gc=r(G.C);t.gf=r(G.F)}
else if(m==="pct"){t.p=r(G.P*4/tot*100);t.c=r(G.C*4/tot*100);t.f=Math.max(0,100-t.p-t.c)}
else{if(W)t.kg=Math.round(G.P/W*100)/100;const cf=G.C*4+G.F*9||1;t.c=r(G.C*4/cf*100);t.f=100-t.c}
t.m=m;save();render()}
function setWeightToday(v){v=+v;if(!(v>0))return;S.weights=S.weights.filter(w=>w.date!==today());S.weights.push({date:today(),kg:v});save();render()}
function setMT(k,v){const t=cp().mt=cp().mt||{...DEF};t[k]=k==="m"?v:+v||0;save();render()}
function setPreset(i){const a=PR[i];cp().mt={...(cp().mt||DEF),m:"pct",p:a[1],c:a[2],f:a[3]};save();render()}
function vMT(){const t=cp().mt||DEF,G=goals(),md=(m,l)=>`<button class="${t.m===m?"":"alt"}" onclick="setMacroMode('${m}')">${l}</button>`,inp=(k,l)=>`<div><small>${l}</small><input type="number" inputmode="decimal" value="${t[k]??""}" onchange="setMT('${k}',this.value)"></div>`;
const sel=PR.findIndex(a=>t.m==="pct"&&t.p===a[1]&&t.c===a[2]&&t.f===a[3]),pre=PR.map((a,i)=>`<button class="${i===sel?"":"alt"}" onclick="setPreset(${i})">${i===sel?"✓ ":""}${a[0]} ${a[1]}/${a[2]}/${a[3]}</button>`).join("");
const fields=t.m==="g"?inp("gp","Protein (g)")+inp("gc","Carbs (g)")+inp("gf","Fat (g)"):t.m==="kg"?inp("kg","Protein g per kg")+inp("c","Carbs % of the rest")+inp("f","Fat % of the rest"):inp("p","Protein %")+inp("c","Carbs %")+inp("f","Fat %");
const kc=G.P*4+G.C*4+G.F*9,sum=t.m==="pct"?t.p+t.c+t.f:0;
return `<div class="card" id="macros" style="border:2px solid var(--ac)"><h3>Macro targets for ${esc(cp().name)}</h3><small style="margin-bottom:8px">Presets show protein/carbs/fat as a share of calories. ${sel<0?"You’re using a custom split.":""}</small><div class="g2">${pre}</div><div class="seg">${md("pct","Percent")}${md("g","Grams")}${md("kg","Per kg")}</div><div class="g2">${fields}</div><div class="prev">Goals: protein ${r(G.P)} g, carbs ${r(G.C)} g, fat ${r(G.F)} g (${r(kc)} kcal)</div>${sum&&sum!==100?`<small style="color:var(--dn)">Percentages add up to ${sum}, not 100.</small>`:""}${t.m==="kg"&&!lastW()?'<small>Add your weight in the goal card above or in Charts. Until then, protein uses the percent split.</small>':""}${t.m==="g"&&Math.abs(kc-(S.target||2000))>25?`<small>That is ${r(Math.abs(kc-(S.target||2000)))} kcal ${kc>(S.target||2000)?"above":"below"} your calorie target.</small>`:""}<h3 style="margin-top:14px">Other nutrient targets</h3><div class="g2">${[["fi","Fibre (g)"],["sa","Saturates max (% of calories)"],["su","Free sugars max (% of calories)"],["sl","Salt max (g)"]].map(a=>`<div><small>${a[1]}</small><input type="number" inputmode="decimal" value="${(cp().nt||NDEF)[a[0]]}" onchange="setNT('${a[0]}',this.value)"></div>`).join("")}</div><small>Defaults follow UK guidance: fibre 30 g, saturates 11%, free sugars 5%, salt 6 g.</small></div>`}
function vMore(){return `<h2>Settings</h2><div class="card"><h3>Account</h3><small>Signed in as ${esc(ME.email)}. Use the profile menu at the top of any page to switch profile.</small><button class="alt" style="margin-top:10px" onclick="signOut()">Sign out</button></div><div class="card"><h3>Library</h3><div class="seg"><button class="alt" onclick="goTab('foods')">Foods</button><button class="alt" onclick="goTab('rec')">Recipes</button></div></div>${vGoal()}<div class="card"><h3>Daily calorie target for ${esc(cp().name)}</h3><input type="number" inputmode="numeric" value="${S.target}" onchange="S.target=+this.value||2000;save();render()"></div>${vMT()}
<div class="card"><h3>Past entries</h3><small style="margin-bottom:8px">After you set free sugars, fibre, saturates or salt on a food, one tap fills them in on entries you logged earlier. It uses the food’s current values and the amount you logged.</small><button onclick="recalcPast()">Recalculate past entries</button>${fixMsg?`<small style="margin-top:8px">${esc(fixMsg)}</small>`:""}</div>
<div class="card"><h3>Backup</h3><small style="margin-bottom:8px">Your data is saved to your account. Export a copy now and then as a backup. To bring in an older backup, paste it here and choose which profile in the file is yours.</small><textarea id="bk" rows="5" placeholder="Export fills this box. Paste a backup here to import."></textarea>
<small style="margin-top:10px">Import from file profile</small><select id="ip"><option value="0">First profile</option><option value="1">Second profile</option></select><div class="seg" style="margin-top:10px"><button onclick="exp()">Export</button><button class="alt" onclick="importLegacy()">Import</button></div><small id="bm"></small></div>`}
function exp(){const b=$("#bk");b.value=JSON.stringify(S);b.select();try{navigator.clipboard.writeText(b.value);$("#bm").textContent="Exported and copied."}catch(e){$("#bm").textContent="Exported. Copy the text above."}}
function render(){$("#pb").innerHTML=`<select aria-label="Profile" onchange="setProf(this.value)">${S.profiles.map(p=>`<option value="${p.id}"${p.id===S.cur?" selected":""}>${esc(p.name)}</option>`).join("")}</select><small id="sync">${syncTxt}</small>`;$("#app").innerHTML={today:vToday,foods:vFoods,rec:vRec,chart:vChart,chat:vChat,more:vMore}[tab]();document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));prev();sum();res();if(tab==="foods"){dsearch(dq);offShow()}}
document.querySelectorAll("nav button[data-t]").forEach(b=>b.onclick=()=>{$("#pm").hidden=true;tab=b.dataset.t;add.open=null;mealPushed=false;render();scrollTo(0,tab==="chat"?document.body.scrollHeight:0)});
boot();
</script></body></html>
