<script>
const $=s=>document.querySelector(s),r=n=>Math.round(n),r1=n=>Math.round(n*10)/10,uid=()=>crypto.randomUUID();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const SB_URL="https://olrghmfqjenejdjcuoar.supabase.co",SB_KEY="sb_publishable_rrpWdrvaoQy1JCTjLZAUTg_SxESVBXT";
const sb=supabase.createClient(SB_URL,SB_KEY);
let S={foods:[],recipes:[],profiles:[],cur:"",left:false},ME=null,HH=null,READY=false,syncTxt="";
try{S.left=localStorage.getItem("plate_left")==="1"}catch(e){}
const cp=()=>S.profiles.find(p=>p.id===S.cur)||S.profiles[0];
function link(){["log","weights","target"].forEach(k=>Object.defineProperty(S,k,{get(){return cp()[k]},set(v){cp()[k]=v},enumerable:false,configurable:true}))}
link();
const ok=async p=>{const r=await p;if(r.error)throw r.error;return r.data};
const num=v=>v==null?null:+v,ne=o=>o&&Object.keys(o).length?o:undefined;
async function fetchAll(q){let out=[],from=0;for(;;){const d=await ok(q().range(from,from+999));out=out.concat(d);if(d.length<1000)break;from+=1000}return out}
const rowToEntry=x=>({id:x.id,date:x.entry_date,meal:x.meal,name:x.name,label:x.label||"",k:+x.kcal,p:+x.protein,c:+x.carbs,f:+x.fat,fi:num(x.fibre),su:num(x.sugars),sa:num(x.saturates),sl:num(x.salt),inc:x.incomplete||null});
const erow=(l,u)=>({id:l.id,household_id:HH,user_id:u,entry_date:l.date,meal:MEALS.includes(l.meal)?l.meal:"Snacks",name:l.name,label:l.label||null,kcal:l.k,protein:l.p,carbs:l.c,fat:l.f,fibre:l.fi??null,sugars:l.su??null,saturates:l.sa??null,salt:l.sl??null,incomplete:l.inc||null});
async function loadAll(user){
const mem=await ok(sb.from("household_members").select("household_id,user_id,display_name"));
const mr=mem.find(m=>m.user_id===user.id);if(!mr)throw new Error("Your account isn’t linked to a household yet.");
HH=mr.household_id;const ids=mem.map(m=>m.user_id);
try{await ok(sb.from("user_settings").upsert(ids.map(u=>({user_id:u})),{onConflict:"user_id",ignoreDuplicates:true}))}catch(e){console.error(e)}
const sets=await ok(sb.from("user_settings").select("*").in("user_id",ids));
const foods=await fetchAll(()=>sb.from("foods").select("*").order("id"));
const recs=await fetchAll(()=>sb.from("recipes").select("*, recipe_ingredients(food_id,grams,sort)").order("id"));
const ents=await fetchAll(()=>sb.from("entries").select("*").eq("household_id",HH).order("id"));
const wts=await fetchAll(()=>sb.from("weights").select("*").in("user_id",ids).order("weigh_date"));
S.foods=foods.map(x=>({id:x.id,name:x.name,k:+x.kcal,p:+x.protein,c:+x.carbs,f:+x.fat,fi:num(x.fibre),su:num(x.sugars),sa:num(x.saturates),sl:num(x.salt),sg:+x.serving_g||0}));
S.recipes=recs.map(x=>({id:x.id,name:x.name,cooked:+x.cooked_weight_g||0,servings:+x.servings||1,ings:(x.recipe_ingredients||[]).sort((a,b)=>a.sort-b.sort).map(i=>({fid:i.food_id,g:+i.grams}))}));
S.profiles=mem.slice().sort((a,b)=>(b.user_id===user.id)-(a.user_id===user.id)).map(m=>{const s=sets.find(x=>x.user_id===m.user_id)||{};return{id:m.user_id,name:m.display_name,target:s.calorie_target||2000,mt:ne(s.macro_targets),nt:ne(s.nutrient_targets),gl:ne(s.goal),log:ents.filter(e=>e.user_id===m.user_id).map(rowToEntry),weights:wts.filter(w=>w.user_id===m.user_id).map(w=>({date:w.weigh_date,kg:+w.kg}))}});
let sel=user.id;try{const c=localStorage.getItem("plate_cur");if(S.profiles.some(p=>p.id===c))sel=c}catch(e){}
S.cur=sel;mark();READY=true}
const FK=f=>JSON.stringify([f.name,f.k,f.p,f.c,f.f,f.fi??null,f.su??null,f.sa??null,f.sl??null,f.sg||0]);
const RK=r=>JSON.stringify([r.name,r.cooked||0,r.servings||1,r.ings.map(i=>[i.fid,+i.g])]);
const WK=w=>String(w.kg),SK=p=>JSON.stringify([p.target,p.mt??null,p.nt??null,p.gl??null]);
let snap={f:new Map(),r:new Map(),e:new Map(),w:new Map(),s:""},busy=false,again=false,tm=null,dirty=false;
function mark(){snap={f:new Map(S.foods.map(x=>[x.id,FK(x)])),r:new Map(S.recipes.map(x=>[x.id,RK(x)])),e:new Map(),w:new Map(),s:new Map()};S.profiles.forEach(p=>{p.log.forEach(l=>snap.e.set(l.id,1));p.weights.forEach(w=>snap.w.set(p.id+"|"+w.date,WK(w)));snap.s.set(p.id,SK(p))})}
const chg=(map,items,key,id)=>{const ids=new Set(items.map(id));return{up:items.filter(x=>map.get(id(x))!==key(x)),del:[...map.keys()].filter(k=>!ids.has(k))}};
function status(t,bad){syncTxt=t;const e=$("#sync");if(e){e.textContent=t;e.style.color=bad?"var(--dn)":""}}
function save(){if(!READY)return;dirty=true;status("Saving…");clearTimeout(tm);tm=setTimeout(push,400)}
async function push(){if(busy){again=true;return}busy=true;try{await pushAll();dirty=false;status("Saved")}catch(e){console.error(e);status("Not saved, retrying",true);tm=setTimeout(push,8000)}busy=false;if(again){again=false;push()}}
async function pushAll(){const now=new Date().toISOString();
const fd=chg(snap.f,S.foods,FK,x=>x.id);
if(fd.up.length){await ok(sb.from("foods").upsert(fd.up.map(f=>({id:f.id,household_id:HH,name:f.name,kcal:f.k,protein:f.p,carbs:f.c,fat:f.f,fibre:f.fi??null,sugars:f.su??null,saturates:f.sa??null,salt:f.sl??null,serving_g:f.sg||null,updated_at:now}))));fd.up.forEach(f=>snap.f.set(f.id,FK(f)))}
const rd=chg(snap.r,S.recipes,RK,x=>x.id);
for(const r of rd.up){await ok(sb.from("recipes").upsert({id:r.id,household_id:HH,name:r.name,cooked_weight_g:r.cooked||null,servings:r.servings||1,updated_at:now}));
await ok(sb.from("recipe_ingredients").delete().eq("recipe_id",r.id));
if(r.ings.length)await ok(sb.from("recipe_ingredients").insert(r.ings.map((i,n)=>({recipe_id:r.id,food_id:i.fid,grams:+i.g,sort:n}))));snap.r.set(r.id,RK(r))}
const all=[];S.profiles.forEach(p=>p.log.forEach(l=>all.push([l,p.id])));
const ne2=all.filter(([l])=>!snap.e.has(l.id));
if(ne2.length){await ok(sb.from("entries").insert(ne2.map(([l,u])=>erow(l,u))));ne2.forEach(([l])=>snap.e.set(l.id,1))}
const wall=[];S.profiles.forEach(p=>p.weights.forEach(w=>wall.push({p:p.id,date:w.date,kg:w.kg,k:p.id+"|"+w.date})));
const wd=chg(snap.w,wall,x=>String(x.kg),x=>x.k);
if(wd.up.length){await ok(sb.from("weights").upsert(wd.up.map(x=>({user_id:x.p,weigh_date:x.date,kg:x.kg}))));wd.up.forEach(x=>snap.w.set(x.k,String(x.kg)))}
for(const p of S.profiles){const sk=SK(p);if(sk!==snap.s.get(p.id)){await ok(sb.from("user_settings").upsert({user_id:p.id,calorie_target:p.target,macro_targets:p.mt||{},nutrient_targets:p.nt||{},goal:p.gl||{},updated_at:now}));snap.s.set(p.id,sk)}}
const ids=new Set(all.map(([l])=>l.id)),de=[...snap.e.keys()].filter(k=>!ids.has(k));
if(de.length){await ok(sb.from("entries").delete().in("id",de));de.forEach(k=>snap.e.delete(k))}
if(rd.del.length){await ok(sb.from("recipes").delete().in("id",rd.del));rd.del.forEach(k=>snap.r.delete(k))}
if(fd.del.length){await ok(sb.from("foods").delete().in("id",fd.del));fd.del.forEach(k=>snap.f.delete(k))}
for(const k of wd.del){const[u,d]=k.split("|");await ok(sb.from("weights").delete().eq("user_id",u).eq("weigh_date",d));snap.w.delete(k)}}
let off=[],chat={msgs:[],busy:false,draft:""};
try{chat.msgs=JSON.parse(localStorage.getItem("plate_chat")||"[]")}catch(e){}
const chatSave=()=>{try{localStorage.setItem("plate_chat",JSON.stringify(chat.msgs.slice(-30)))}catch(e){}};
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
const token=async()=>{const{data:{session}}=await sb.auth.getSession();if(!session)throw new Error("Please sign in again.");return session.access_token};
async function onlineSearch(){const q=(dq||"").trim(),e=$("#or");if(!e)return;
if(q.length<2){e.innerHTML='<small>Type a product name or barcode in the box above first.</small>';return}
e.innerHTML="<small>Searching Open Food Facts…</small>";
try{const r=await fetch("/api/foods?"+(/^\d{8,14}$/.test(q)?"code=":"q=")+encodeURIComponent(q),{headers:{Authorization:"Bearer "+await token()}});const j=await r.json();if(!r.ok)throw new Error(j.error||"Search failed");off=j.items||[];offShow()}
catch(x){e.innerHTML=`<small style="color:var(--dn)">${esc(x.message)}</small>`}}
function offShow(){const e=$("#or");if(!e||!off.length&&!e.innerHTML.includes("Searching"))return;if(!off.length){e.innerHTML='<div class="empty">No products found.</div>';return}
e.innerHTML=off.map((d,i)=>{const have=S.foods.some(f=>f.name.toLowerCase()===d.name.toLowerCase()),p=d.per100;return `<div class="row"><div><b>${esc(d.name)}</b><small>Per 100 g: ${r(p.k)} kcal, P ${r1(p.p)} C ${r1(p.c)} F ${r1(p.f)}${p.fi!=null?`, fibre ${r1(p.fi)}`:""}</small></div>${have?"<small>Added</small>":`<button onclick="addOff(${i})">Add</button>`}</div>`}).join("")+'<small style="margin-top:6px">Data from Open Food Facts. It is community-contributed, so check it against the packet.</small>'}
function addOff(i){const d=off[i];if(!d)return;const p=d.per100;S.foods.push({id:uid(),name:d.name,k:p.k,p:p.p,c:p.c,f:p.f,fi:p.fi,su:p.su,sa:p.sa,sl:p.sl,sg:d.sg||0});save();render()}
function withProf(id,fn){const o=S.cur;S.cur=id;try{return fn()}finally{S.cur=o}}
function chatCtx(){const act=S.cur,d0=new Date(today()+"T12:00:00");
const profs=S.profiles.map(p=>withProf(p.id,()=>{const G=goals(),nt=p.nt||NDEF;
const tot=dt=>{const T={k:0,p:0,c:0,f:0,fi:0,su:0,sa:0,sl:0};p.log.filter(l=>l.date===dt).forEach(l=>{M.forEach(m=>T[m]+=l[m]);N.forEach(n=>{if(l[n]!=null)T[n]+=l[n]})});Object.keys(T).forEach(k=>T[k]=r1(T[k]));return T};
const days=[];for(let i=13;i>=0;i--){const d=new Date(d0);d.setDate(d.getDate()-i);const s=d.toISOString().slice(0,10);if(p.log.some(l=>l.date===s))days.push({date:s,...tot(s)})}
return{name:p.name,active:p.id===act,targets:{kcal:S.target||2000,protein_g:r(G.P),carbs_g:r(G.C),fat_g:r(G.F),fibre_g:nt.fi,saturates_max_pct_of_kcal:nt.sa,sugars_max_pct_of_kcal:nt.su,salt_max_g:nt.sl},goal:p.gl||null,today:tot(today()),days,weights:[...p.weights].sort((a,b)=>a.date.localeCompare(b.date)).slice(-10)}}));
const rd=v=>v==null?null:r1(v);
return{today:today(),weekday:d0.toLocaleDateString("en-GB",{weekday:"long"}),profiles:profs,items:items().map(i=>({id:i.id,name:i.name,type:i.t==="Recipes"?"recipe":"food",per100:{k:rd(i.per.k),p:rd(i.per.p),c:rd(i.per.c),f:rd(i.per.f),fi:rd(i.per.fi),su:rd(i.per.su),sa:rd(i.per.sa),sl:rd(i.per.sl)},serving_g:r(i.sg)}))}}
async function sendChat(){const t=chat.draft.trim();if(!t||chat.busy)return;
chat.msgs.push({role:"user",text:t});chat.draft="";chat.busy=true;chatSave();render();scrollTo(0,document.body.scrollHeight);
try{const hist=chat.msgs.filter(m=>!m.err).slice(-12).map(m=>({role:m.role,text:m.text+(m.actions&&!m.done?" (awaiting confirmation)":m.doneText?" ("+m.doneText+")":"")}));
const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+await token()},body:JSON.stringify({messages:hist,context:chatCtx()})});
const j=await r.json();if(!r.ok)throw new Error(j.error||"Something went wrong");
chat.msgs.push({role:"assistant",text:j.reply||"…",actions:j.actions&&j.actions.length?j.actions:null})}
catch(e){chat.msgs.push({role:"assistant",text:"Sorry, I couldn’t answer that. "+e.message,err:true})}
chat.busy=false;chatSave();render();scrollTo(0,document.body.scrollHeight)}
function newChat(){chat.msgs=[];chat.draft="";chatSave();render()}
function actInfo(a){let per,sg;if(a.kind==="database"&&a.food){per=a.food;sg=a.food.sg||100}else{const it=items().find(i=>i.id===a.id);if(!it)return"";per=it.per;sg=it.sg}const g=a.unit==="servings"?a.amount*sg:a.amount;return ", "+r(per.k*g/100)+" kcal"}
function actHTML(m,i){if(m.done)return `<small>${esc(m.doneText||"")}</small>`;if(!m.actions)return"";
return `<div class="card" style="margin:6px 0">${m.actions.map(a=>`<div class="row"><div><b>${esc(a.name)}</b><small>${esc(a.profile)}, ${esc(a.meal)}, ${esc(a.date)}: ${a.amount} ${a.unit==="servings"?(a.amount===1?"serving":"servings"):"g"}${actInfo(a)}</small></div></div>`).join("")}<div class="seg" style="margin-top:8px"><button onclick="runActions(${i})">Confirm</button><button class="alt" onclick="dismissActions(${i})">Dismiss</button></div></div>`}
function runActions(i){const m=chat.msgs[i];if(!m||!m.actions||m.done)return;let n=0;
m.actions.forEach(a=>{const pr=S.profiles.find(p=>p.name.toLowerCase()===String(a.profile||"").toLowerCase())||cp();let id=a.id;
if(a.kind==="database"&&a.food){let f=S.foods.find(x=>x.name.toLowerCase()===a.food.name.toLowerCase());if(!f){f={id:uid(),name:a.food.name,k:a.food.k,p:a.food.p,c:a.food.c,f:a.food.f,fi:a.food.fi??null,su:a.food.su??null,sa:a.food.sa??null,sl:a.food.sl??null,sg:a.food.sg||0};S.foods.push(f)}id=f.id}
const it=items().find(x=>x.id===id);if(!it)return;const g=a.unit==="servings"?a.amount*it.sg:a.amount;if(!(g>0))return;
pr.log.push({id:uid(),date:/^\d{4}-\d{2}-\d{2}$/.test(a.date||"")?a.date:today(),meal:MEALS.includes(a.meal)?a.meal:autoMeal(),name:it.name,label:a.unit==="servings"?`${+a.amount} serving${+a.amount===1?"":"s"} (${r(g)} g)`:`${r(g)} g`,...mac(it,g)});n++});
m.done=true;m.doneText=n?`Logged ${n} item${n===1?"":"s"}.`:"Nothing could be logged.";save();chatSave();render()}
function dismissActions(i){const m=chat.msgs[i];if(!m)return;m.done=true;m.doneText="Dismissed.";chatSave();render()}
function vChat(){const ms=chat.msgs.map((m,i)=>`<div class="bub ${m.role==="user"?"u":"a"}">${fmt(m.text)}</div>${m.role==="assistant"?actHTML(m,i):""}`).join("");
return `<h2>Chat</h2>${ms||'<div class="empty">Ask about your day, get meal ideas, or tell me what you ate, for example “two eggs and toast for breakfast”. I’ll ask you to confirm before anything is logged.</div>'}${chat.busy?'<div class="bub a">Thinking…</div>':""}
<div class="card" style="position:sticky;bottom:calc(58px + env(safe-area-inset-bottom,0px));margin:12px 0 0"><textarea id="ci" rows="2" placeholder="Ask a question or tell me what you ate" oninput="chat.draft=this.value">${esc(chat.draft)}</textarea><div class="seg" style="margin:8px 0 0"><button onclick="sendChat()"${chat.busy?" disabled":""}>Send</button><button class="alt" onclick="newChat()">New chat</button></div></div>`}
async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session){showLogin();return}
try{ME=session.user;await loadAll(ME);document.body.classList.add("ready");$("#pb").style.display="";render()}
catch(e){console.error(e);$("#app").innerHTML=`<div class="card"><h3>Couldn’t load your data</h3><small>${esc(e.message||String(e))}</small><div class="seg" style="margin-top:10px"><button onclick="location.reload()">Try again</button><button class="alt" onclick="signOut()">Sign out</button></div></div>`}}

const blank=()=>({name:"",ings:[{fid:"",g:"",name:""}],cooked:"",servings:""});
function pickIng(k,v){const n=v.trim().toLowerCase();let f=S.foods.find(x=>x.name.toLowerCase()===n);if(!f){const d=DB.find(x=>x.n.toLowerCase()===n);if(d){f={id:uid(),name:d.n,k:d.k,p:d.p,c:d.c,f:d.f,sg:0};S.foods.push(f);save()}}
draft.ings[k].name=f?f.name:v;draft.ings[k].fid=f?f.id:"";sum()}
function rmIng(k){draft.ings.splice(k,1);if(!draft.ings.length)draft.ings.push({fid:"",g:"",name:""});render()}
function editRec(id){const x=S.recipes.find(a=>a.id===id);if(!x)return;draft={id:x.id,name:x.name,ings:x.ings.map(i=>({fid:i.fid,g:i.g,name:(S.foods.find(f=>f.id===i.fid)||{}).name||""})),cooked:x.cooked||"",servings:x.servings||""};render();scrollTo(0,0)}
function cancelEdit(){draft=blank();render()}
function addRec(){const bad=draft.ings.find(i=>(i.name||"").trim()&&!i.fid);if(bad){$("#sum").textContent=`“${bad.name}” isn’t in your foods. Add it in the Foods tab first.`;return}
const ings=draft.ings.filter(i=>i.fid&&+i.g>0).map(i=>({fid:i.fid,g:+i.g}));if(!draft.name.trim()||!ings.length){$("#sum").textContent="Add a name and at least one ingredient with a weight.";return}
const x={id:draft.id||uid(),name:draft.name.trim(),ings,cooked:+draft.cooked||0,servings:+draft.servings||1},i=S.recipes.findIndex(a=>a.id===x.id);if(i>=0)S.recipes[i]=x;else S.recipes.push(x);draft=blank();save();render()}
function delRec(id){S.recipes=S.recipes.filter(x=>x.id!==id);save();render()}
function vWeight(){const A=[...S.weights].sort((a,b)=>a.date.localeCompare(b.date));let e=null;const TR=A.map(w=>{e=e===null?w.kg:e+(w.kg-e)*.2;return{...w,t:e}});
const c=new Date(today()+"T12:00:00");c.setDate(c.getDate()-days+1);const cs=c.toISOString().slice(0,10),t0=c.getTime(),P=TR.filter(w=>w.date>=cs),last=TR[TR.length-1],fd=d=>new Date(d+"T12:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
let svg='<small style="margin-top:6px">Log at least two weigh-ins in this range to see a chart.</small>';
if(P.length>=2){const vs=P.flatMap(p=>[p.kg,p.t]),lo=Math.min(...vs),hi=Math.max(...vs),sp=(hi-lo)||1,X=d=>10+(new Date(d+"T12:00:00").getTime()-t0)/864e5/((days-1)||1)*300,Y=v=>8+(1-(v-lo)/sp)*100;
svg=`<svg viewBox="0 0 320 120" width="100%" role="img" aria-label="Weight over time">`+P.map(p=>`<circle cx="${X(p.date)}" cy="${Y(p.kg)}" r="2.5" fill="var(--mu)"/>`).join("")+`<polyline fill="none" stroke="var(--ac)" stroke-width="2.5" points="${P.map(p=>X(p.date)+","+Y(p.t)).join(" ")}"/></svg><small>Dots are daily weigh-ins and the line is your trend, which smooths out daily ups and downs. Range ${r1(lo)} to ${r1(hi)} kg.</small>`}
const ch=P.length>=2?P[P.length-1].t-P[0].t:null;
return `<div class="card"><h3>Weight</h3><div class="g2"><input id="wd" type="date" value="${today()}"><input id="wk" type="number" inputmode="decimal" step="0.1" placeholder="Weight in kg"></div><button onclick="addW()">Save weight</button></div>
<div class="card">${last?`<div class="big">${r1(last.t)} <span>kg trend, latest ${r1(last.kg)} kg</span></div>`+(ch!==null?`<small style="margin:6px 0">${ch>0?"Up":ch<0?"Down":"No change"} ${r1(Math.abs(ch))} kg over this period.</small>`:"")+svg:'<div class="empty">Add your first weigh-in above.</div>'}</div>
<div class="card"><h3>Recent weigh-ins</h3>${TR.length?TR.slice(-5).reverse().map(w=>`<div class="row"><div><b>${r1(w.kg)} kg</b><small>${fd(w.date)}</small></div><button class="x" onclick="delW('${w.date}')">Delete</button></div>`).join(""):'<div class="empty">Nothing yet.</div>'}</div>`}
function addW(){const v=+$("#wk").value,d=$("#wd").value;if(!(v>0)||!d)return;S.weights=S.weights.filter(w=>w.date!==d);S.weights.push({date:d,kg:v});save();render()}
function delW(d){S.weights=S.weights.filter(w=>w.date!==d);save();render()}
let days=7;
function vChart(){const B=today(),D=[];for(let i=days-1;i>=0;i--){const d=new Date(B+"T12:00:00");d.setDate(d.getDate()-i);const s=d.toISOString().slice(0,10),T={k:0,p:0,c:0,f:0,n:0};S.log.filter(l=>l.date===s).forEach(l=>{M.forEach(m=>T[m]+=l[m]);T.n++});D.push({s,d,...T})}
const L=D.filter(x=>x.n),av=m=>L.length?L.reduce((a,x)=>a+x[m],0)/L.length:0;
const mx=Math.max(S.target*1.15,...D.map(x=>x.k),1),W=320,H=150,bw=W/days,ty=H-S.target/mx*H;
const bars=D.map((x,i)=>{const h=x.k/mx*H,cx=i*bw+bw/2,lab=days<=7?x.d.toLocaleDateString("en-GB",{weekday:"short"}).slice(0,2):(days<=14||i%5===0?x.d.getDate():"");
return `<rect x="${i*bw+bw*.15}" y="${H-h}" width="${bw*.7}" height="${h}" rx="3" fill="${x.k>S.target?"var(--f)":"var(--ac)"}"/><text x="${cx}" y="${H+14}" text-anchor="middle" font-size="9" fill="var(--mu)">${lab}</text>`}).join("");
const pk=av("p")*4,ck=av("c")*4,fk=av("f")*9,tt=pk+ck+fk||1,sh=v=>r(v/tt*100);
const rg=[7,14,30].map(n=>`<button class="${days===n?"":"alt"}" onclick="days=${n};render()">${n} days</button>`).join("");
return `<h2>Charts</h2><div class="seg">${rg}</div><div class="card"><h3>Calories per day</h3><svg viewBox="0 0 ${W} ${H+20}" width="100%" role="img" aria-label="Daily calories">${bars}<line x1="0" x2="${W}" y1="${ty}" y2="${ty}" stroke="var(--mu)" stroke-dasharray="4 3"/></svg>
<small>Dashed line is your ${S.target} kcal target. Bars turn amber when you go over it.</small></div>
<div class="card"><h3>Averages on logged days</h3>${L.length?`<div class="big">${r(av("k"))} <span>kcal a day, ${L.length} day${L.length===1?"":"s"} logged</span></div>
<div class="mac" style="margin:12px 0"><div><b style="color:var(--p)">${r(av("p"))} g</b>protein</div><div><b style="color:var(--c)">${r(av("c"))} g</b>carbs</div><div><b style="color:var(--f)">${r(av("f"))} g</b>fat</div></div>
<div style="display:flex;height:10px;border-radius:5px;overflow:hidden"><i style="width:${sh(pk)}%;background:var(--p)"></i><i style="width:${sh(ck)}%;background:var(--c)"></i><i style="width:${sh(fk)}%;background:var(--f)"></i></div>
<small style="margin-top:6px">Share of calories: protein ${sh(pk)}%, carbs ${sh(ck)}%, fat ${sh(fk)}%</small>`:'<div class="empty">Log some meals and your trends will appear here.</div>'}</div>`+vWeight()}
const NDEF={fi:30,sa:11,su:5,sl:6};
const GDEF={type:"maintain",gw:0,rate:.5,maint:0,ht:0,age:0,sex:"",act:1.375};
function setGL(k,v){const g=cp().gl=cp().gl||{...GDEF};g[k]=(k==="type"||k==="sex")?v:+v||0;save();render()}
function applyGoal(n){S.target=n;save();render()}
function gcalc(){const g={...GDEF,...(cp().gl||{})},W=lastW(),o={g,W,w:[],n:[],ok:true},bad=m=>{o.w.push(m);o.ok=false};
o.est=(g.ht&&g.age&&g.sex&&W)?Math.round((10*W+6.25*g.ht-5*g.age+(g.sex==="m"?5:-161))*g.act):0;o.maint=g.maint||o.est;
o.mx=(g.type==="gain"?Math.min(.5,.005*W):Math.min(1,.01*W))||.5;o.rate=g.type==="maintain"?0:Math.min(g.rate||.25,o.mx);
if(g.age&&g.age<18)bad("This tool is for adults aged 18 and over.");
if(!o.maint)bad("Enter your maintenance calories, or fill in height, age, sex and activity for an estimate.");
if(g.type!=="maintain"){if(!W)bad("Log your weight in Charts first.");
if(g.type==="lose"){if(!g.gw||g.gw>=W)bad("Set a goal weight below your current weight.");
if(!g.ht)bad("Add your height so I can check your goal weight is healthy.");
else if(g.gw&&g.gw/((g.ht/100)**2)<18.5)bad(`That goal weight is below a healthy BMI. The lowest I’ll allow for your height is ${r1(18.5*(g.ht/100)**2)} kg.`)}
else if(!g.gw||g.gw<=W)bad("Set a goal weight above your current weight.")}
if(g.type!=="maintain"&&g.rate>o.mx)o.n.push(`Rate capped at ${o.mx.toFixed(2)} kg a week for your weight.`);
const dl=o.rate*1100,fl=g.sex==="m"?1500:1200;let d=o.maint+(g.type==="gain"?dl:g.type==="lose"?-dl:0),eff=o.rate;
if(g.type==="lose"&&d<fl){d=fl;eff=Math.max(0,(o.maint-fl)/1100);o.n.push(`Held at the ${fl} kcal minimum, so progress will be slower than the rate you chose.`)}
o.daily=Math.round(d);o.delta=Math.abs(o.daily-o.maint);
o.eta=(g.type!=="maintain"&&eff>0&&g.gw&&W&&o.ok)?new Date(Date.now()+Math.abs(g.gw-W)/eff*6048e5):null;return o}
function vGoal(){const o=gcalc(),g=o.g,miss=[!o.W&&"weight",!g.ht&&"height",!g.age&&"age",!g.sex&&"sex"].filter(Boolean),seg=(k,l)=>`<button class="${g.type===k?"":"alt"}" onclick="setGL('type','${k}')">${l}</button>`,
f=(k,l,v)=>`<div><small>${l}</small><input type="number" inputmode="decimal" value="${v||""}" onchange="setGL('${k}',this.value)"></div>`;
const res=(o.ok?`<div class="prev">Daily target: ${o.daily} kcal</div><small>${g.type==="maintain"?"Your maintenance level.":`Maintenance ${o.maint} ${g.type==="gain"?"plus":"minus"} ${r(o.delta)} kcal a day.`}${o.eta?` At this pace you’d reach ${g.gw} kg around ${o.eta.toLocaleDateString("en-GB",{month:"long",year:"numeric"})}.`:""}</small>`:"")+o.w.map(x=>`<small style="color:var(--dn)">${x}</small>`).join("")+o.n.map(x=>`<small>${x}</small>`).join("")+(o.ok?(()=>{const G=goals(o.daily);return `<small>At ${o.daily} kcal, your macros would be about protein ${r(G.P)} g, carbs ${r(G.C)} g and fat ${r(G.F)} g.</small><div class="seg" style="margin-top:10px"><button onclick="applyGoal(${o.daily})">Set as my calorie target</button><button class="alt" onclick="$('#macros').scrollIntoView({behavior:'smooth'})">Adjust macros</button></div>`})():"");
return `<div class="card"><h3>Weight goal for ${esc(cp().name)}</h3><small style="margin-bottom:8px">For healthy adults. Not for pregnancy, breastfeeding or medical conditions, where you should follow your doctor’s advice.</small>
<div class="seg">${seg("lose","Lose")}${seg("maintain","Maintain")}${seg("gain","Gain")}</div>
${g.type!=="maintain"?`<div class="g2">${f("gw","Goal weight (kg)",g.gw)}<div><small>Now</small><b>${o.W?r1(o.W)+" kg":"none logged"}</b></div></div><small>Rate: <b id="rv">${o.rate}</b> kg a week, max ${o.mx.toFixed(2)}</small><input type="range" min="0.05" max="${o.mx}" step="0.05" value="${o.rate||.25}" oninput="$('#rv').textContent=this.value" onchange="setGL('rate',this.value)">`:""}
<div class="g2" style="margin-top:10px"><div><small>Weight (kg)</small><input type="number" inputmode="decimal" step="0.1" value="${o.W?r1(o.W):""}" onchange="setWeightToday(this.value)"></div>${f("ht","Height (cm)",g.ht)}${f("age","Age",g.age)}<div><small>Sex</small><select onchange="setGL('sex',this.value)"><option value="">Choose</option><option value="f"${g.sex==="f"?" selected":""}>Female</option><option value="m"${g.sex==="m"?" selected":""}>Male</option></select></div></div>
<small>Activity</small><select onchange="setGL('act',this.value)">${[[1.2,"Mostly sitting, little exercise"],[1.375,"Light, exercise 1 to 3 days a week"],[1.55,"Moderate, exercise 3 to 5 days a week"],[1.725,"Very active, 6 to 7 days a week"]].map(a=>`<option value="${a[0]}"${g.act==a[0]?" selected":""}>${a[1]}</option>`).join("")}</select>
<div style="margin-top:10px"><small>Maintenance kcal</small><input type="number" inputmode="decimal" value="${g.maint||o.est||""}" placeholder="Needs weight, height, age and sex" onchange="setGL('maint',this.value)">${g.maint&&o.est&&g.maint!==o.est?`<button class="alt" style="margin-top:8px" onclick="setGL('maint',0)">Switch back to the estimate (${o.est})</button>`:""}</div>
<small style="margin:8px 0">${g.maint?"Using your own maintenance figure.":o.est?`This is an estimate from your weight, height, age, sex and activity. Type your own figure to override it.`:`Add your ${miss.join(", ")} to get an estimate.`} About 7,700 kcal equals 1 kg, so real progress varies. Check your trend after a few weeks.</small>${res}</div>`}
function setNT(k,v){const t=cp().nt=cp().nt||{...NDEF};t[k]=+v||0;save();render()}
function setMacroMode(m){const t=cp().mt=cp().mt||{...DEF};if(t.m===m)return;const G=goals(),tot=G.P*4+G.C*4+G.F*9||1,W=lastW();
if(m==="g"){t.gp=r(G.P);t.gc=r(G.C);t.gf=r(G.F)}
else if(m==="pct"){t.p=r(G.P*4/tot*100);t.c=r(G.C*4/tot*100);t.f=Math.max(0,100-t.p-t.c)}
else{if(W)t.kg=Math.round(G.P/W*100)/100;const cf=G.C*4+G.F*9||1;t.c=r(G.C*4/cf*100);t.f=100-t.c}
t.m=m;save();render()}
function setWeightToday(v){v=+v;if(!(v>0))return;S.weights=S.weights.filter(w=>w.date!==today());S.weights.push({date:today(),kg:v});save();render()}
function setMT(k,v){const t=cp().mt=cp().mt||{...DEF};t[k]=k==="m"?v:+v||0;save();render()}
function setPreset(i){const a=PR[i];cp().mt={...(cp().mt||DEF),m:"pct",p:a[1],c:a[2],f:a[3]};save();render()}
function vMT(){const t=cp().mt||DEF,G=goals(),md=(m,l)=>`<button class="${t.m===m?"":"alt"}" onclick="setMacroMode('${m}')">${l}</button>`,inp=(k,l)=>`<div><small>${l}</small><input type="number" inputmode="decimal" value="${t[k]??""}" onchange="setMT('${k}',this.value)"></div>`;
const sel=PR.findIndex(a=>t.m==="pct"&&t.p===a[1]&&t.c===a[2]&&t.f===a[3]),pre=PR.map((a,i)=>`<button class="${i===sel?"":"alt"}" onclick="setPreset(${i})">${i===sel?"✓ ":""}${a[0]} ${a[1]}/${a[2]}/${a[3]}</button>`).join("");
const fields=t.m==="g"?inp("gp","Protein (g)")+inp("gc","Carbs (g)")+inp("gf","Fat (g)"):t.m==="kg"?inp("kg","Protein g per kg")+inp("c","Carbs % of the rest")+inp("f","Fat % of the rest"):inp("p","Protein %")+inp("c","Carbs %")+inp("f","Fat %");
const kc=G.P*4+G.C*4+G.F*9,sum=t.m==="pct"?t.p+t.c+t.f:0;
return `<div class="card" id="macros" style="border:2px solid var(--ac)"><h3>Macro targets for ${esc(cp().name)}</h3><small style="margin-bottom:8px">Presets show protein/carbs/fat as a share of calories. ${sel<0?"You’re using a custom split.":""}</small><div class="g2">${pre}</div><div class="seg">${md("pct","Percent")}${md("g","Grams")}${md("kg","Per kg")}</div><div class="g2">${fields}</div><div class="prev">Goals: protein ${r(G.P)} g, carbs ${r(G.C)} g, fat ${r(G.F)} g (${r(kc)} kcal)</div>${sum&&sum!==100?`<small style="color:var(--dn)">Percentages add up to ${sum}, not 100.</small>`:""}${t.m==="kg"&&!lastW()?'<small>Add your weight in the goal card above or in Charts. Until then, protein uses the percent split.</small>':""}${t.m==="g"&&Math.abs(kc-(S.target||2000))>25?`<small>That is ${r(Math.abs(kc-(S.target||2000)))} kcal ${kc>(S.target||2000)?"above":"below"} your calorie target.</small>`:""}<h3 style="margin-top:14px">Other nutrient targets</h3><div class="g2">${[["fi","Fibre (g)"],["sa","Saturates max (% of calories)"],["su","Sugars max (% of calories)"],["sl","Salt max (g)"]].map(a=>`<div><small>${a[1]}</small><input type="number" inputmode="decimal" value="${(cp().nt||NDEF)[a[0]]}" onchange="setNT('${a[0]}',this.value)"></div>`).join("")}</div><small>Defaults follow UK guidance: fibre 30 g, saturates 11%, free sugars 5%, salt 6 g.</small></div>`}
function vMore(){return `<h2>Settings</h2><div class="card"><h3>Account</h3><small>Signed in as ${esc(ME.email)}. Use the buttons at the top of any page to switch profile.</small><button class="alt" style="margin-top:10px" onclick="signOut()">Sign out</button></div>${vGoal()}<div class="card"><h3>Daily calorie target for ${esc(cp().name)}</h3><input type="number" inputmode="numeric" value="${S.target}" onchange="S.target=+this.value||2000;save();render()"></div>${vMT()}
<div class="card"><h3>Backup</h3><small style="margin-bottom:8px">Your data is saved to your account. Export a copy now and then as a backup. To bring in an older backup, paste it here and choose which profile in the file is yours.</small><textarea id="bk" rows="5" placeholder="Export fills this box. Paste a backup here to import."></textarea>
<small style="margin-top:10px">Import from file profile</small><select id="ip"><option value="0">First profile</option><option value="1">Second profile</option></select><div class="seg" style="margin-top:10px"><button onclick="exp()">Export</button><button class="alt" onclick="importLegacy()">Import</button></div><small id="bm"></small></div>`}
function exp(){const b=$("#bk");b.value=JSON.stringify(S);b.select();try{navigator.clipboard.writeText(b.value);$("#bm").textContent="Exported and copied."}catch(e){$("#bm").textContent="Exported. Copy the text above."}}
function render(){$("#pb").innerHTML=S.profiles.map(p=>`<button class="${p.id===S.cur?"":"alt"}" onclick="setProf('${p.id}')">${esc(p.name)}</button>`).join("")+`<small id="sync" style="margin:0;align-self:center;min-width:64px;text-align:right">${syncTxt}</small>`;$("#app").innerHTML={today:vToday,foods:vFoods,rec:vRec,chart:vChart,chat:vChat,more:vMore}[tab]();document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));prev();sum();res();if(tab==="foods"){dsearch(dq);offShow()}}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();scrollTo(0,tab==="chat"?document.body.scrollHeight:0)});
boot();
</script></body></html>
